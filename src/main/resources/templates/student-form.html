<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 40px;
        }
        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        h1 { color: #1e293b; }
        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }
        .cancel { background: #64748b; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${student.id == null} ? 'Add Student' : 'Edit Student'">
        Student Form
    </h1>

    <form th:action="@{/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="name">Student Name</label>
        <input type="text" id="name" th:field="*{name}"
               placeholder="Enter student name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" th:field="*{email}"
               placeholder="Enter email address" required>

        <label for="course">Course</label>
        <input type="text" id="course" th:field="*{course}"
               placeholder="Enter course name" required>

        <button class="btn" type="submit">Save Student</button>
        <a class="btn cancel" th:href="@{/}">Cancel</a>
    </form>
</div>
</body>
</html>
